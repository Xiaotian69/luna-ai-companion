<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luna README hero</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1600px; height: 720px; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f3f3f7;
      background:
        radial-gradient(circle at 89% 10%, rgba(165, 110, 118, .26), transparent 26%),
        radial-gradient(circle at 12% 92%, rgba(111, 115, 155, .32), transparent 30%),
        #171921;
    }
    .canvas { position: relative; width: 100%; height: 100%; padding: 82px 76px; display: grid; grid-template-columns: 680px 1fr; gap: 62px; align-items: center; }
    .stars, .stars::before, .stars::after { position: absolute; border-radius: 50%; background: #f3f3f7; content: ""; opacity: .58; }
    .stars { width: 3px; height: 3px; top: 82px; left: 835px; box-shadow: 115px 44px #f3f3f7, 286px -12px #f3f3f7, 520px 70px #f3f3f7, 640px 250px #f3f3f7, 440px 490px #f3f3f7, 180px 535px #f3f3f7; }
    .stars::before { width: 2px; height: 2px; transform: translate(80px, 245px); box-shadow: 260px 10px #f3f3f7, 470px -90px #f3f3f7, 570px 185px #f3f3f7; }
    .copy { position: relative; z-index: 2; }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 58px; font-size: 28px; font-weight: 700; letter-spacing: .06em; }
    .moon { position: relative; width: 46px; height: 46px; border-radius: 50%; background: #f3f3f7; box-shadow: 0 0 34px rgba(243, 243, 247, .18); }
    .moon::after { content: ""; position: absolute; width: 42px; height: 42px; left: 13px; top: -5px; border-radius: 50%; background: #171921; }
    .kicker { margin: 0 0 20px; color: #a9add7; font-size: 17px; font-weight: 750; letter-spacing: .22em; }
    h1 { margin: 0; max-width: 650px; font-family: Georgia, "Times New Roman", serif; font-size: 70px; line-height: .98; letter-spacing: -.035em; font-weight: 500; }
    .capabilities { margin: 30px 0 0; color: rgba(243, 243, 247, .76); font-size: 19px; letter-spacing: .015em; }
    .visual { position: relative; z-index: 2; height: 526px; }
    .orbit { position: absolute; width: 505px; height: 505px; right: 36px; top: 8px; border: 1px solid rgba(165, 110, 118, .34); border-radius: 50%; transform: rotate(-13deg); }
    .orbit::before { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #a56e76; right: 46px; top: 75px; box-shadow: 0 0 20px rgba(165, 110, 118, .75); }
    .shot { position: absolute; width: 735px; height: 456px; top: 42px; left: 0; overflow: hidden; border: 1px solid rgba(243, 243, 247, .16); border-radius: 28px; background: #171921; box-shadow: 0 34px 80px rgba(5, 6, 10, .48); transform: rotate(1.2deg); }
    .shot::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(243, 243, 247, .05); border-radius: inherit; }
    .shot img { display: block; width: 735px; height: auto; transform: translateY(-4px); }
    .memory-chip { position: absolute; z-index: 3; right: 4px; bottom: 10px; width: 274px; padding: 17px 20px; border: 1px solid rgba(243, 243, 247, .14); border-radius: 18px; background: rgba(38, 40, 51, .96); box-shadow: 0 18px 40px rgba(5, 6, 10, .36); }
    .memory-chip small { display: block; margin-bottom: 7px; color: #a9add7; font-size: 11px; font-weight: 750; letter-spacing: .16em; }
    .memory-chip span { font-size: 15px; line-height: 1.45; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="stars"></div>
    <section class="copy">
      <div class="brand"><span class="moon"></span><span>LUNA</span></div>
      <p class="kicker">MEET YOUR AI COMPANION</p>
      <h1>She remembers what matters.</h1>
      <p class="capabilities">Transparent memory · Natural voice · Self-hostable.</p>
    </section>
    <section class="visual" aria-label="Luna chat preview">
      <div class="orbit"></div>
      <div class="shot"><img src="./screenshots/chat.png" alt="Luna chat interface"></div>
      <div class="memory-chip"><small>MEMORY, WITH CONTROL</small><span>Running twice a week · 82% importance</span></div>
    </section>
  </main>
</body>
</html>
